# /etc/nginx/sites-available/forum.innertalk.space
# Symlink to sites-enabled, then `nginx -t && systemctl reload nginx`.
# Certbot will mutate this file to add SSL on first run.

upstream forum_frontend {
    server 127.0.0.1:3030;
    keepalive 32;
}

upstream forum_backend {
    server 127.0.0.1:8030;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name forum.innertalk.space;

    # Let's Encrypt HTTP-01 challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 50m;

    # Gzip
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Hardening
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ===== Backend API =====
    # Browser requests https://forum.innertalk.space/api/sections etc.
    # Strip /api/ before forwarding so FastAPI sees /sections.
    location ^~ /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://forum_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ===== Next.js immutable assets — long cache =====
    location ^~ /_next/static/ {
        proxy_pass http://forum_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ===== favicon / public images =====
    location = /favicon.svg {
        proxy_pass http://forum_frontend;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location = /logo.svg {
        proxy_pass http://forum_frontend;
        add_header Cache-Control "public, max-age=86400" always;
    }
    location = /logo-icon.svg {
        proxy_pass http://forum_frontend;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # ===== Frontend (Next.js) =====
    location / {
        proxy_pass http://forum_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    access_log /var/log/nginx/forum.access.log;
    error_log  /var/log/nginx/forum.error.log warn;
}
