// spectator.cfg — endless-war forum headless spectator client.
//
// Executed by xash3d-fwgs right after +connect lands. Drives the
// client into a "transparent observer" state — joins spectator team,
// disables sounds we don't need, sets a neutral nickname.

// Identity
name "forum_spectator"

// Disable user input — this is a headless feed, no human steers it
cl_movespeedkey 1
sensitivity 1

// Quality / perf trim — we're rendering for ffmpeg capture, not a human
fps_max 30
m_filter 0
cl_cmdrate 30
cl_updaterate 30

// Spectator team auto-join — once the menu loads, fire team 6
// (Spectators) and HUD chooses the auto-camera target.
alias do_spec "jointeam 6; spec_mode 4; spec_autodirector 1"
wait 100 do_spec
