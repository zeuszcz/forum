# MediaMTX config for the endless-war live spectator stream pipeline.
#
# We feed one source (`cs1`) over RTMP from a local ffmpeg encoder
# capturing the headless HL/CS 1.6 spectator's Xvfb display.
# Two egress protocols are served:
#
#   * LL-HLS via nginx /stream/ (~2-4s latency, default for casual)
#   * WebRTC via nginx /whep/    (~200-500ms latency, used in pilot mode)
#
# Both consume the same RTMP source — MediaMTX remuxes per protocol.

logLevel: info
logDestinations: [stdout]
logFile: ""

# Resource caps so the pipeline can't eat the whole VPS if something
# misbehaves.
readBufferCount: 512
udpMaxPayloadSize: 1472

# Disable everything we don't use to free up ports.
api: no
metrics: no
pprof: no
playback: no

rtsp: no

# RTMP — input from local ffmpeg. Loopback only.
rtmp: yes
rtmpAddress: 127.0.0.1:1935
rtmpEncryption: "no"

# HLS — output to nginx → browser.
hls: yes
hlsAddress: 127.0.0.1:8888
hlsAllowOrigin: "*"
hlsAlwaysRemux: yes
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 50M
hlsDirectory: ""

# ------------------------------------------------------------------
# WebRTC — sub-second egress for pilot mode.
#
# Signaling goes through nginx (HTTPS) -> 127.0.0.1:8889 (WHEP). Media
# flows on UDP 8189 directly between viewer and the VPS public IP
# (browsers don't proxy WebRTC media through HTTP).
#
# UFW must allow 8189/udp from anywhere.
# ------------------------------------------------------------------
webrtc: yes
webrtcAddress: 127.0.0.1:8889
webrtcEncryption: no
webrtcServerKey: ""
webrtcServerCert: ""
webrtcAllowOrigin: "*"
webrtcTrustedProxies: []
# Single UDP port that all WebRTC sessions multiplex onto — easier to
# whitelist in UFW than a random ephemeral range. 0.0.0.0 binds on all
# interfaces (IPv4) so the docker bridge can reach it AND public IP.
webrtcICEUDPMuxAddress: 0.0.0.0:8189
# Public hostnames/IPs to include in advertised ICE candidates so
# browsers can actually route to us. UPDATE IF VPS IP CHANGES.
webrtcAdditionalHosts:
  - 170.168.72.200
# STUN to help clients behind NATs do hole-punching.
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

# SRT — off.
srt: no

paths:
  cs1:
    # Allow only local pushes (the local ffmpeg encoder).
    source: publisher
    sourceOnDemand: no
    # On-demand readback: if no viewer for 5 min, drop the published
    # stream so the ffmpeg pipeline upstream can detect zero viewers
    # and shut itself down too.
    runOnDemand: ""
    runOnDemandRestart: no
    runOnDemandStartTimeout: 10s
    runOnDemandCloseAfter: 5m
