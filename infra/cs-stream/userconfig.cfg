// Auto-spectator userconfig — runs after xash3d-fwgs client init.
//
// v3 — ProcessCmds rate-limit hardening. The jail server runs the
// ProcessCmds meta-mod plugin (v1.2.0.6) which kicks clients with
// "Banned for move commands flooding (burst)" when usercmd packets
// arrive faster than the configured threshold. Headless xash3d at
// fps_max 30 was still tripping it under chase-cam, so we now also
// pin cl_cmdrate / cl_updaterate / rate explicitly and zero out any
// stray input devices.
//
// Auto-reconnect after a kick is handled externally by the
// spec-watchdog.sh helper invoked from cs-spectator.service — not
// from here, because xash3d does not expose a reliable on-disconnect
// hook to a CFG.

name "forum_spectator"

fps_max 30
cl_cmdrate 15
cl_updaterate 15
rate 7500

volume 0
m_pitch 0
m_yaw 0
sensitivity 0

// UTF-8 chat / HUD rendering so server-side Cyrillic comes through
// correctly instead of byte-per-glyph CP1252 garbage.
hud_utf8 1
vgui_utf8 1
cl_charset "utf-8"
con_charset "cp1251"

echo "[FORUM] firing autoconnect..."
wait
wait
wait
wait
wait
connect 37.230.228.248:27015
