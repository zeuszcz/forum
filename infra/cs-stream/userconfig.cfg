// Auto-spectator userconfig — runs after xash3d-fwgs client init.
//
// v5 — heavy render-loop optimization. xash3d on Mesa llvmpipe
// (software OpenGL) burned 73% of one VPS core with 21% iowait =
// ~93% utilization. Any micro-stall in the GL pipeline showed up as
// visible jitter on the encoded stream. We cut the load with two
// moves:
//
//   1) fps_max 15 — halves the render work. Encoder still grabs at
//      24 fps via x11grab; identical buffers compress to zero bytes
//      in libx264, so the stream remains smooth-looking. ProcessCmds
//      anti-flood throttle (cl_cmdrate / cl_updaterate, kept from v3)
//      is independent of fps_max so this does not re-trigger the
//      "move commands flooding" kick.
//
//   2) Renderer-feature kill list — all the per-frame cost we don't
//      need on a top-down spectator view. Decals, blood, gibs, view
//      models, dynamic lights, glow shells, corpses linger, smoke
//      sprites: every one of these costs CPU on the software renderer
//      and contributes nothing to top-down map awareness.

name "forum_spectator"

// fps_max v3: 30 was 15 — the headless spec processes input only on
// each render tick, so at 15 fps WASD lag was ~66 ms per key event
// (on top of network + xdotool). 30 cuts that to ~33 ms and stays
// well within Mesa llvmpipe's CPU budget on the 4-core VPS.
// cmd/update rate stays at 15 (server-throttle for ProcessCmds).
fps_max 30
cl_cmdrate 15
cl_updaterate 15
rate 7500

developer 0
con_notifytime 0
dev_overview 0

volume 0
m_pitch 0
m_yaw 0
sensitivity 0

// ----------------------------------------------------------------
// Render-feature kill list (heavy → cheap)
// ----------------------------------------------------------------
r_decals 0
mp_decals 0
r_drawviewmodel 0
cl_himodels 0
cl_minmodels 1
cl_corpsestay 0
violence_hgibs 0
violence_ablood 0
violence_hblood 0
violence_agibs 0
r_traceglow 0
r_glowshellfreq 0
fastsprites 2
cl_smoothtime 0.001
cl_lw 1
cl_lc 1
gl_dynamic 0
cl_dynamiccrosshair 0
mp_decals 0
ex_extrapmax 0
ex_interp 0.1

// UTF-8 chat / HUD rendering so server-side Cyrillic comes through
// correctly instead of byte-per-glyph CP1252 garbage.
hud_utf8 1
vgui_utf8 1
cl_charset "utf-8"
con_charset "cp1251"

echo "[FORUM] firing autoconnect..."
wait
wait
wait
wait
wait
connect 37.230.228.248:27015
