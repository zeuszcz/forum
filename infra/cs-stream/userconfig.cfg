// Auto-spectator userconfig — runs after xash3d-fwgs client init.
//
// v4 — silence notify overlay. The encoder bakes the rendered viewport
// into the published HLS stream, so any text that the engine flashes
// on the screen (developer warnings, chat, kill feed dev info) ends up
// visible to every /live viewer. We belt-and-suspenders:
//   - developer 0       → gate Con_DPrintf calls (incl. tempent overflow)
//   - con_notifytime 0  → kill the on-screen notify overlay duration
//   - dev_overview 0    → no engine overview text
// `-dev 1` was also stripped from start.sh — see start.sh v6 header.
//
// v3 carried the ProcessCmds anti-flood throttle; v4 keeps it untouched.

name "forum_spectator"

fps_max 30
cl_cmdrate 15
cl_updaterate 15
rate 7500

developer 0
con_notifytime 0
dev_overview 0

volume 0
m_pitch 0
m_yaw 0
sensitivity 0

// UTF-8 chat / HUD rendering so server-side Cyrillic comes through
// correctly instead of byte-per-glyph CP1252 garbage.
hud_utf8 1
vgui_utf8 1
cl_charset "utf-8"
con_charset "cp1251"

echo "[FORUM] firing autoconnect..."
wait
wait
wait
wait
wait
connect 37.230.228.248:27015
