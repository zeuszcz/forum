// Auto-spectator userconfig — runs after xash3d-fwgs client init.
name "forum_spectator"
fps_max 30
volume 0
m_pitch 0
m_yaw 0
// UTF-8 chat / HUD rendering so server-side Cyrillic from Reunion-aware
// plugins comes through correctly instead of byte-per-glyph CP1252.
hud_utf8 1
vgui_utf8 1
cl_charset "utf-8"
con_charset "cp1251"
echo "[FORUM] firing autoconnect..."
wait
wait
wait
wait
wait
connect 37.230.228.248:27015
