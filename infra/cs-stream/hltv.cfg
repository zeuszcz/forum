// hltv.cfg — endless-war HLTV proxy
//
// HLTV core boots with only meta-commands (loadmodule, exec, quit).
// We load the master (game-server connector) + proxy (client relay)
// modules first, then the rest of the commands become available.

loadmodule master
loadmodule proxy

// --- identity / auth -------------------------------------------------
adminpassword  "endlesswarhltvadminpw"
proxypassword  ""
spectatorpassword ""

// --- pipeline tuning -------------------------------------------------
delay      30        // built-in HLTV broadcast delay (seconds) — required
maxrate    20000     // per-client bandwidth cap (bytes/s)
chatmode   1         // pass through game chat to local viewers
publicgame 0         // do NOT list us on Valve's master server list

// --- master connection — the game server we mirror -------------------
connect 37.230.228.248:27015
