name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: endlesswar
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: endlesswar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U endlesswar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy app
        continue-on-error: true   # warn-only until codebase is fully typed

      - name: Tests
        env:
          SECRET_KEY: ci_secret_key_change_me_to_something_long_enough
          POSTGRES_USER: endlesswar
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: endlesswar_test
          POSTGRES_HOST: localhost
          MINIO_ACCESS_KEY: minio_access_ci
          MINIO_SECRET_KEY: minio_secret_ci
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: endless-war-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: endless-war-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
